<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#1c4f9c"/>
    </linearGradient>
  </defs>

  <!-- Text -->
  <g transform="translate(80,120)">
    <text x="0" y="160" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="800" fill="url(#blue)">БТИ</text>
    <text x="4" y="235" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#6b7280" letter-spacing="6">КОРПОРЕЙШН</text>
  </g>

  <!-- Icon (clean, flat style) -->
  <g transform="translate(650,110)">
    
    <!-- ballot processing device (main block) -->
    <rect x="0" y="40" width="160" height="180" rx="12" fill="#e5e7eb" stroke="#9ca3af" stroke-width="3"/>
    
    <!-- screen -->
    <rect x="25" y="60" width="110" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- slot -->
    <rect x="40" y="135" width="80" height="10" rx="5" fill="#374151"/>
    
    <!-- checkmark paper -->
    <rect x="95" y="0" width="55" height="80" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <path d="M110 35 L122 50 L145 20" stroke="#2f80ed" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- computer monitor -->
    <rect x="190" y="40" width="120" height="80" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <rect x="235" y="120" width="30" height="30" rx="4" fill="#6b7280"/>
    <rect x="210" y="150" width="80" height="12" rx="6" fill="#374151"/>

    <!-- system unit -->
    <rect x="330" y="30" width="60" height="190" rx="10" fill="#1f2937"/>
    <circle cx="360" cy="90" r="6" fill="#60a5fa"/>
    <circle cx="360" cy="120" r="6" fill="#93c5fd"/>

  </g>
</svg>
