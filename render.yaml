services:
  - type: web
    name: web-project-zayavki-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: ATLAS_URI
        sync: false
      - key: AUTH_LOGIN
        value: marsel
      - key: AUTH_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
